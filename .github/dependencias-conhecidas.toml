[[frontend]]
pacote = "react-router"
advisory = "GHSA-2j2x-hqr9-3h42"
severidade = "moderate"
faixa = ">=7.0.0 <7.14.1"
classe = "aceito_com_prazo"
motivo = "Redirect de mesma origem com caminho iniciado por // vira open redirect. ALCANCA o SPA, ao contrario dos outros oito deste pacote. O sink existe: AuthGuard.tsx:22 grava `location.pathname` em `state.from` e LoginPage.tsx:86,111,148 faz `navigate(from)`. O que fecha hoje e o casamento de rota: caminho iniciado por // ou \\\\ nao casa com nenhuma rota sob o AuthGuard e cai no `path=\"*\"` (App.tsx:80), que nao grava `from`. Os outros destinos dinamicos sao internos (`/kb/${id}` em KBFormPage.tsx:223,360 e `item.path` em Sidebar.tsx:230), e nenhum redirect vem de query string (`grep -rnE \"searchParams.get\\('(next|redirect|returnUrl|from)\" src/` -> vazio). Provado em src/test/components/guards.test.tsx. O argumento depende da tabela de rotas continuar sem curinga sob o AuthGuard: por isso `aceito_com_prazo`, e nao `nao_aplicavel`."
remover_quando = "na subida do react-router para >= 7.18.2, que fecha os dez avisos de uma vez; antes disso, se surgir rota curinga sob o AuthGuard ou destino de redirect vindo de query string"
responsavel = "TI/Dev"
data = "2026-09-02"

