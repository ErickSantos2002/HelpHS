# Vulnerabilidades conhecidas e aceitas — baseline da auditoria de dependências
#
# O CI falha quando aparece vulnerabilidade que NÃO está aqui. Este arquivo é a
# linha entre "dívida que a equipe examinou e aceitou" e "surpresa que ninguém
# viu chegar" — e a segunda é a única que o gate precisa barrar.
#
# ── REGRAS ───────────────────────────────────────────────────────────────────
#
# 1. Toda entrada precisa de `motivo` preenchido. O verificador RECUSA entrada
#    sem justificativa: ignorar sem escrever por quê é o mesmo que não ignorar,
#    só que sem deixar rastro.
#
# 2. Toda entrada precisa de `remover_quando`. Baseline sem condição de saída
#    vira lista que só cresce, e lista que só cresce ninguém lê.
#
# 3. Entrada OBSOLETA — cuja vulnerabilidade não aparece mais — também derruba
#    o CI. É chato de propósito: a mensagem diz qual linha apagar, é conserto de
#    dez segundos, e sem isso o arquivo apodrece.
#
# 4. Nada de wildcard, nada de ignorar pacote inteiro. UMA LINHA POR ADVISORY.
#
#    A chave do backend é `id` (o pip-audit já devolve identificador global). A
#    do front é `pacote` + `advisory`, e não só o pacote — a primeira versão
#    deste arquivo indexava por pacote e tinha um buraco que anulava o gate:
#    advisory NOVO num pacote já listado passava calado. Era exatamente o que
#    este arquivo existe para pegar.
#
#    O buraco vinha acompanhado de um segundo defeito, pior de enxergar: a
#    justificativa acabava escrita para UM advisory e herdada por todos os
#    outros do pacote. O `react-router` tinha um `motivo` sobre RSC/turbo-stream
#    e, debaixo dele, dois open redirects de <Link>/useNavigate que o argumento
#    de RSC não explica. Ao separar por advisory os dois apareceram, e estão
#    aqui como `aceito_com_prazo` — não como "não aplicável".
#
# 5. Pacote sinalizado só por HERANÇA não entra. Quando o `via` do npm é apenas
#    o nome de outro pacote (`react-router-dom` -> `react-router`,
#    `@vitest/coverage-v8` -> `@vitest/browser`), o aviso é o do pacote de
#    baixo, que já tem entrada própria. O verificador imprime esses nomes a
#    cada rodada, para ninguém achar que deixaram de ser vigiados.
#
# ── COMO RODAR LOCALMENTE ────────────────────────────────────────────────────
#
#     cd backend  && pip install pip-audit && python ../.github/scripts/verifica_dependencias.py
#     cd frontend && npm ci && python ../.github/scripts/verifica_dependencias.py
#
# O script aceita `--lado backend`, `--lado frontend` ou nenhum (faz os dois).
#
# ── COMO ATUALIZAR ───────────────────────────────────────────────────────────
#
# Vulnerabilidade nova quebrou o CI? A pergunta NÃO é "como faço passar". É:
#
#     esse código é alcançável no HelpHS?
#
#   • alcançável  -> conserte. Suba o pacote, ou mitigue na aplicação. Só entra
#                    aqui depois, e como `mitigado_na_aplicacao` ou
#                    `mitigado_por_configuracao`, com a evidência.
#   • inalcançável -> entra como `nao_aplicavel`, e o `motivo` precisa dizer o
#                    COMANDO que provou isso. "Parece não usado" não serve.
#
# Quem aprova ignore novo: TI/Dev, no code review do PR que mexer neste arquivo.
#
# ─────────────────────────────────────────────────────────────────────────────
# Levantamento de 01/09/2026. Cada `motivo` abaixo cita o comando que o provou.


# ══ BACKEND — pip-audit ══════════════════════════════════════════════════════

[[backend]]
id = "CVE-2026-55558"
pacote = "aiosmtplib"
versao_atual = "3.0.2"
versao_corrigida = "5.1.2"
classe = "mitigado_por_configuracao"
motivo = """
O aviso afeta SÓ quem faz o upgrade por STARTTLS: bytes lidos em texto claro
sobrevivem ao handshake. Produção usa TLS IMPLÍCITO na 465, onde não existe
perna em claro. Testado contra o provedor sem enviar e-mail e sem credencial —
smtp.resend.com:465 aceitou TLSv1.3 e anunciou AUTH. Depois, e-mail real ENTREGUE
na caixa em 01/09. E a config não depende de memória: `app/core/config.py` derruba
o boot em produção/staging se SMTP_TLS=true com aiosmtplib vulnerável, com 13
testes prendendo a guarda.
"""
remover_quando = "aiosmtplib >= 5.1.2 for possível — hoje travado por fastapi-mail <4.0.0"
responsavel = "TI/Dev"
data = "2026-09-01"

