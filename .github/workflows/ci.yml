name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Backend ────────────────────────────────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest

    # PostgreSQL de verdade para os testes das agregacoes do dashboard, que
    # usam date_trunc, extract('isodow') e count(...).filter(...) -- construcoes
    # que mock nao valida e que o SQLite nem compila. O resto da suite continua
    # mockando o banco e nao toca neste servico.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: helphs_testes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        working-directory: backend
        run: ruff check .

      - name: Black format check
        working-directory: backend
        run: black --check .

      # Roda so em app/: os testes usam mock pesado e anotar tudo la custaria
      # mais do que protege. Zerado em 25/08/2026 -- se voltar a acusar, e
      # porque a mudanca introduziu o erro, nao porque a divida voltou.
      - name: Mypy type check
        working-directory: backend
        run: mypy app

      - name: Pytest
        working-directory: backend
        run: pytest --tb=short
        env:
          DATABASE_URL: postgresql+asyncpg://user:pass@localhost/db
          APP_ENV: testing
          # Sem esta variavel os testes de agregacao se PULAM (localmente eles
          # sobem um Postgres efemero via pgserver). Aqui apontam para o
          # servico acima -- e um banco proprio, nao o DATABASE_URL da app.
          TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/helphs_testes

      # Falha para vulnerabilidade NOVA, fora do baseline. Nao usa
      # continue-on-error de proposito: gate que nao barra nada e teatro, e este
      # projeto ja gastou um dia inteiro caçando verde decorativo.
      #
      # O baseline vive em .github/dependencias-conhecidas.toml, com o motivo e
      # a condicao de remocao de cada item. O script recusa entrada sem
      # justificativa -- ignorar sem escrever por que e o que ele existe para
      # impedir.
      #
      # Roda por ultimo: se cair, o resultado de lint e teste ja apareceu.
      - name: Auditoria de dependencias
        run: python .github/scripts/verifica_dependencias.py --lado backend

  # ── Frontend ───────────────────────────────────────────────
  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      # `tsc --noEmit` NAO serve aqui: o tsconfig.json e um solution file
      # ("files": [] + references), entao ele termina sem saida mesmo com erro
      # de tipo. Dava verde decorativo — quem lia este passo achava que o
      # typecheck tinha passado. `tsc -b` e o mesmo comando do `npm run build`
      # e do Dockerfile, e e o que realmente checa.
      - name: TypeScript check
        working-directory: frontend
        run: npx tsc -b

      - name: Vitest
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

      # Mesmo gate, outro lado. Reaproveita o node_modules que o `npm ci` acima
      # ja instalou -- nao ha segundo install.
      #
      # `python3` sem setup-python: o runner ubuntu ja traz 3.12, e o script so
      # precisa de tomllib, que e stdlib desde o 3.11.
      - name: Auditoria de dependencias
        run: python3 .github/scripts/verifica_dependencias.py --lado frontend
