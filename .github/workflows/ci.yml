name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Backend ────────────────────────────────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        working-directory: backend
        run: ruff check .

      - name: Black format check
        working-directory: backend
        run: black --check .

      # Roda so em app/: os testes usam mock pesado e anotar tudo la custaria
      # mais do que protege. Zerado em 25/08/2026 -- se voltar a acusar, e
      # porque a mudanca introduziu o erro, nao porque a divida voltou.
      - name: Mypy type check
        working-directory: backend
        run: mypy app

      - name: Pytest
        working-directory: backend
        run: pytest --tb=short
        env:
          DATABASE_URL: postgresql+asyncpg://user:pass@localhost/db
          APP_ENV: testing

  # ── Frontend ───────────────────────────────────────────────
  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      # `tsc --noEmit` NAO serve aqui: o tsconfig.json e um solution file
      # ("files": [] + references), entao ele termina sem saida mesmo com erro
      # de tipo. Dava verde decorativo — quem lia este passo achava que o
      # typecheck tinha passado. `tsc -b` e o mesmo comando do `npm run build`
      # e do Dockerfile, e e o que realmente checa.
      - name: TypeScript check
        working-directory: frontend
        run: npx tsc -b

      - name: Vitest
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build
