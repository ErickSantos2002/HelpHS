name: E2E

# Separado do ci.yml de propósito: este workflow sobe Postgres, Redis, backend
# e front, e leva perto de dez minutos. Não pode segurar push.
#
# Por enquanto só roda à mão. O agendamento noturno entra depois de duas
# execuções manuais verdes seguidas — é descomentar o bloco `schedule`.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "O que rodar. `completa`: a suíte geral, como sempre. `ece01`: só os specs da ECE-01, nos dois modos da flag."
        type: choice
        default: completa
        options:
          - completa
          - ece01
  # schedule:
  #   - cron: "0 6 * * 1-5"  # 03:00 em São Paulo, dias úteis

jobs:
  e2e:
    name: Playwright (chromium)
    # Só fica de fora quando o disparo pede `ece01`. No agendamento não há
    # `inputs`, a comparação dá verdadeiro e o job roda como sempre rodou.
    if: inputs.suite != 'ece01'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: helphs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # O boot só avisa se o Redis faltar, mas o chat e o blacklist de token
      # usam — sem ele o warning vira teste instável.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # `testing` desliga o rate limit. A suíte faz ~16 logins do mesmo IP
      # contra um limite de 5 por 15 minutos — sem isto ela morre no sexto.
      APP_ENV: testing
      # `app.seeds` não cria mais o admin sem esta variável — a senha saiu do
      # código para não nascer conta conhecida no banco real. Aqui o banco é o
      # serviço efêmero do job, e o valor tem de bater com o default do
      # `frontend/e2e/helpers.ts` (há teste guardando os dois lados).
      SEED_ADMIN_PASSWORD: Admin@123456
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/helphs
      REDIS_URL: redis://localhost:6379/0
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      UPLOAD_DIR: ${{ github.workspace }}/backend/uploads
      JWT_PRIVATE_KEY_PATH: ${{ github.workspace }}/backend/keys/private.pem
      JWT_PUBLIC_KEY_PATH: ${{ github.workspace }}/backend/keys/public.pem

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Backend ──────────────────────────────────────────────
      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Chaves JWT efêmeras e diretório de uploads
        # Nenhum segredo do repositório entra aqui: as chaves nascem e morrem
        # com o job, e o banco é descartável.
        working-directory: backend
        run: |
          mkdir -p keys uploads
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out keys/private.pem
          openssl pkey -in keys/private.pem -pubout -out keys/public.pem

      - name: Extensão vector no banco do e2e
        # A migration a7v8w9x0y1z2 exige a extensão e não a cria: pede
        # superusuário e é por banco. A imagem `pgvector/pgvector` só põe os
        # arquivos no servidor. O alvo é o serviço efêmero deste job: o psql
        # roda dentro do contêiner, pelo socket local, que não pede senha.
        run: docker exec ${{ job.services.postgres.id }} psql -U postgres -d helphs -c "CREATE EXTENSION IF NOT EXISTS vector"

      - name: Migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Seeds (os mesmos do boot de produção)
        working-directory: backend
        run: python -m app.seeds

      - name: Seeds do e2e (só aqui — o módulo se recusa a rodar em produção)
        working-directory: backend
        run: python -m app.seeds_e2e

      - name: Sobe o backend na 8001
        # 8001 é o que o proxy do Vite aponta (vite.config.ts).
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8001 > backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8001/health > /dev/null; then
              echo "backend no ar"; exit 0
            fi
            sleep 1
          done
          echo "backend não subiu"; cat backend.log; exit 1

      # ── Frontend ─────────────────────────────────────────────
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright (chromium)
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Playwright
        # O `webServer` do playwright.config.ts sobe o Vite sozinho.
        working-directory: frontend
        env:
          CI: "true"
        run: npx playwright test

      # ── Evidências ───────────────────────────────────────────
      - name: Relatório do Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14

      - name: Log do backend
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend/backend.log
          retention-days: 14

  # ── ECE-01: equipamento compartilhado por empresa ─────────────
  #
  # Um job por modo de `EQUIPAMENTO_POR_EMPRESA`, cada um com o SEU Postgres e
  # o SEU Redis: os serviços são do job, e a matriz dá um job por valor — nada
  # de estado passa de um modo para o outro.
  #
  # O backend lê a flag no boot, então "testar os dois modos" é subir dois
  # backends. A tela não conhece a flag; quem conta ao spec em que modo ele
  # está rodando é `E2E_ECE01`, e sem essa variável os specs `ece01-*` se
  # pulam — é por isso que o job de cima, que não a define, segue igual.
  #
  # Mesma receita do job de cima, passo a passo. Mudou ali, muda aqui.
  ece01:
    name: ECE-01 (flag ${{ matrix.modo }})
    # Só por pedido explícito. `completa` (o padrão) e o agendamento continuam
    # rodando só o job de cima, como antes deste job existir.
    if: inputs.suite == 'ece01'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # O job só lê o repositório. O envio de artefato não usa esta permissão.
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - modo: desligada
            flag: "false"
          - modo: ligada
            flag: "true"

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: helphs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: testing
      SEED_ADMIN_PASSWORD: Admin@123456
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/helphs
      REDIS_URL: redis://localhost:6379/0
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      UPLOAD_DIR: ${{ github.workspace }}/backend/uploads
      JWT_PRIVATE_KEY_PATH: ${{ github.workspace }}/backend/keys/private.pem
      JWT_PUBLIC_KEY_PATH: ${{ github.workspace }}/backend/keys/public.pem
      # O que este job existe para variar. Vale só para o backend deste runner.
      EQUIPAMENTO_POR_EMPRESA: ${{ matrix.flag }}
      # Ditos, e não deixados ao padrão: este job não fala com ninguém de fora.
      # Sem `SMTP_USER` nem remetente, o e-mail não sai (ver services/email.py).
      HELO_ENABLED: "false"
      API4COM_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Chaves JWT efêmeras e diretório de uploads
        working-directory: backend
        run: |
          mkdir -p keys uploads
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out keys/private.pem
          openssl pkey -in keys/private.pem -pubout -out keys/public.pem

      - name: Extensão vector no banco do e2e
        run: docker exec ${{ job.services.postgres.id }} psql -U postgres -d helphs -c "CREATE EXTENSION IF NOT EXISTS vector"

      - name: Migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Seeds (os mesmos do boot de produção)
        working-directory: backend
        run: python -m app.seeds

      - name: Seeds do e2e com o cenário da ECE-01
        # `--ece01` acrescenta grupo, empresas, dois clientes colegas, produto
        # e equipamentos — tudo fictício. O módulo se recusa a rodar em produção.
        working-directory: backend
        run: python -m app.seeds_e2e --ece01

      - name: Sobe o backend na 8001
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8001 > backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8001/health > /dev/null; then
              echo "backend no ar"; exit 0
            fi
            sleep 1
          done
          echo "backend não subiu"; cat backend.log; exit 1

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright (chromium)
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Playwright (só os specs da ECE-01)
        # `e2e/ece01-` casa com o caminho do arquivo — com a pasta junto, para
        # um diretório de checkout chamado "ece01-…" não puxar a suíte inteira.
        # Os specs das outras frentes não entram aqui. O de classificação roda nos dois modos; cada spec de
        # cliente roda no modo dele e se pula no outro.
        working-directory: frontend
        env:
          CI: "true"
          E2E_ECE01: ${{ matrix.modo }}
        run: npx playwright test e2e/ece01-

      - name: Relatório do Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ece01-${{ matrix.modo }}
          path: frontend/playwright-report
          retention-days: 14

      - name: Log do backend
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log-ece01-${{ matrix.modo }}
          path: backend/backend.log
          retention-days: 14
