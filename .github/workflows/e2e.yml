name: E2E

# Separado do ci.yml de propósito: este workflow sobe Postgres, Redis, backend
# e front, e leva perto de dez minutos. Não pode segurar push.
#
# Por enquanto só roda à mão. O agendamento noturno entra depois de duas
# execuções manuais verdes seguidas — é descomentar o bloco `schedule`.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 6 * * 1-5"  # 03:00 em São Paulo, dias úteis

jobs:
  e2e:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: helphs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # O boot só avisa se o Redis faltar, mas o chat e o blacklist de token
      # usam — sem ele o warning vira teste instável.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # `testing` desliga o rate limit. A suíte faz ~16 logins do mesmo IP
      # contra um limite de 5 por 15 minutos — sem isto ela morre no sexto.
      APP_ENV: testing
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/helphs
      REDIS_URL: redis://localhost:6379/0
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      UPLOAD_DIR: ${{ github.workspace }}/backend/uploads
      JWT_PRIVATE_KEY_PATH: ${{ github.workspace }}/backend/keys/private.pem
      JWT_PUBLIC_KEY_PATH: ${{ github.workspace }}/backend/keys/public.pem

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Backend ──────────────────────────────────────────────
      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Chaves JWT efêmeras e diretório de uploads
        # Nenhum segredo do repositório entra aqui: as chaves nascem e morrem
        # com o job, e o banco é descartável.
        working-directory: backend
        run: |
          mkdir -p keys uploads
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out keys/private.pem
          openssl pkey -in keys/private.pem -pubout -out keys/public.pem

      - name: Migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Seeds (os mesmos do boot de produção)
        working-directory: backend
        run: python -m app.seeds

      - name: Seeds do e2e (só aqui — o módulo se recusa a rodar em produção)
        working-directory: backend
        run: python -m app.seeds_e2e

      - name: Sobe o backend na 8001
        # 8001 é o que o proxy do Vite aponta (vite.config.ts).
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8001 > backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8001/health > /dev/null; then
              echo "backend no ar"; exit 0
            fi
            sleep 1
          done
          echo "backend não subiu"; cat backend.log; exit 1

      # ── Frontend ─────────────────────────────────────────────
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright (chromium)
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Playwright
        # O `webServer` do playwright.config.ts sobe o Vite sozinho.
        working-directory: frontend
        env:
          CI: "true"
        run: npx playwright test

      # ── Evidências ───────────────────────────────────────────
      - name: Relatório do Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14

      - name: Log do backend
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend/backend.log
          retention-days: 14
