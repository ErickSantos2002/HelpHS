server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip — nginx >= 1.25 serve .js como text/javascript; manter os dois MIME
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Headers repetidos por location de propósito: um add_header dentro de um
    # location descarta os herdados do nível server.

    # index.html revalida sempre — par obrigatório do "immutable" dos assets;
    # sem isso o navegador segura um HTML que aponta para chunks já removidos.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Só o que o Vite gera com hash no nome pode ser imutável
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # favicon.ico, vite.svg e o fallback SPA: cache por ETag (revalidação)
    location / {
        try_files $uri /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
}
